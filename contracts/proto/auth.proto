syntax = "proto3";

package auth.v1;

import "google/protobuf/empty.proto";

service AuthService {
    rpc SendOtp (SendOtpRequest) returns (SendOtpResponse);
    rpc Ping (google.protobuf.Empty) returns (SendOtpRequest);
}

message SendOtpRequest {
    string identifier = 1;
    string type = 2;
}

message UserProfile {
    string id = 1;
    int32 age = 2;
    double rating = 3;
    bool verified = 4;
    repeated string roles = 5;
    map<string, string> meta = 6;
    Status status = 7;
    oneof contact {
        string email = 8;
        string phone = 9;
    }
}

enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_ACTIVE = 1;
    STATUS_BANNED = 2;
}
